<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4223"/>
      <stop offset="60%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Top Gloss Shine -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Left Leaf Shading -->
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Right Leaf Shading -->
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>

    <!-- Golden Sun / Dewdrop -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#051B0D" flood-opacity="0.4"/>
    </filter>

    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#072813" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Icon Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Top Gloss Highlight -->
  <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#glossGrad)"/>
  
  <!-- Inner Border Ring -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Golden Freshness Sun/Spark Accent -->
  <circle cx="48" cy="16" r="4.5" fill="url(#sunGrad)"/>
  <path d="M48 9.5v2M48 20.5v2M41.5 16h2M52.5 16h2" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main Fresh Leaf Symbol -->
  <g filter="url(#leafShadow)">
    <!-- Right Leaf Half (Lighter / Highlighted) -->
    <path d="M28 47 C 36 46, 47 38, 48 18 C 41 23, 31 34, 28 47 Z" fill="url(#leafRight)"/>
    
    <!-- Left Leaf Half (Deep Mint Green) -->
    <path d="M28 47 C 20 44, 13 35, 15 22 C 22 23, 39 19, 48 18 C 36 29, 29 40, 28 47 Z" fill="url(#leafLeft)"/>

    <!-- Central Organic Vein / Stem -->
    <path d="M14 52 C 16 48, 21 46, 28 47 C 36 34, 43 24, 48 18" fill="none" stroke="#0D3F1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Secondary Delicate Lateral Veins -->
    <path d="M23 37 C 27 34, 32 35, 36 37" fill="none" stroke="#14532D" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M29 29 C 33 26, 38 27, 42 29" fill="none" stroke="#14532D" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>
</svg>
